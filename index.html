<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f7fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="WesGym"><title>WesGym</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="style.css"></head><body>
<div id="app"><header class="topbar"><div><div id="headerDate" class="eyebrow"></div><h1 id="pageTitle">Heute</h1></div></header><main>
<section id="today" class="page active"><div id="todayCard"></div><section class="card"><div class="section-head"><div><h2>Heute eintragen</h2><p>Nur Gewicht und Kalorien</p></div></div><form id="todayForm" class="form"><label>Gewicht (kg)<input id="todayWeight" type="number" step="0.1" inputmode="decimal"></label><label>Kalorien gegessen<input id="todayCalories" type="number" inputmode="numeric"></label><button class="primary" type="submit">Speichern</button></form></section><section class="card"><div class="section-head"><div><h2>Letzte Tage</h2><p>Direkter Vergleich mit deinem Plan</p></div></div><div id="recentDays" class="day-strip"></div></section></section>
<section id="history" class="page"><section class="card"><div class="section-head"><div><h2>Verlauf</h2><p>Jeder Tag als einfache Karte</p></div></div><div id="historyList" class="history-list"></div></section></section>
<section id="plan" class="page"><section class="card"><div class="section-head"><div><h2>Dein Abnehmplan</h2><p>Einmal einstellen, danach läuft alles automatisch</p></div></div><form id="planForm" class="form"><label>Startdatum<input id="startDate" type="date" required></label><label>Startgewicht (kg)<input id="startWeight" type="number" step="0.1" required></label><label>Erhaltungskalorien<input id="maintenanceCalories" type="number" required></label><label>Geplante Tageskalorien<input id="plannedCalories" type="number" required></label><label>Zielgewicht (kg)<input id="goalWeight" type="number" step="0.1"></label><button class="primary" type="submit">Plan speichern</button></form></section><section class="card"><div class="section-head"><div><h2>Plan-Zusammenfassung</h2><p>Theoretische Abnahme</p></div></div><div id="planSummary" class="summary"></div></section><section class="card"><div class="section-head"><div><h2>Daten</h2><p>Backup oder Zurücksetzen</p></div></div><div class="button-stack"><button id="exportBtn" class="secondary">Daten exportieren</button><label class="secondary file-label">Daten importieren<input id="importInput" type="file" accept=".json"></label><button id="resetBtn" class="danger-soft">Alle Daten löschen</button></div></section></section></main>
<nav class="bottom-nav"><button class="active" data-page="today"><span>⌂</span><small>Heute</small></button><button data-page="history"><span>◷</span><small>Verlauf</small></button><button data-page="plan"><span>◎</span><small>Plan</small></button></nav></div>
<div id="modal" class="modal hidden"><div class="shade" data-close></div><div class="sheet"><div class="handle"></div><div id="modalBody"></div></div></div><div id="toast" class="toast hidden"></div><script src="app.js"></script></body></html>
